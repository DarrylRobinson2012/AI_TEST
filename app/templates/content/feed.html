{% extends 'base.html' %}
{% block content %}
<h2>Content Feed</h2>
<div class="row">
  {% for post in posts %}
  <div class="col-md-6">
    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">{{ post.title }}</h5>
        <p class="card-text">{{ post.body }}</p>
        <p class="card-text"><small class="text-muted">By {{ post.author.name }} • {{ post.created_at }}</small></p>
      </div>
    </div>
  </div>
  {% else %}
  <p>No posts yet.</p>
  {% endfor %}
</div>
{% endblock %}
