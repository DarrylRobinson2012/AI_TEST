{% extends 'base.html' %}
{% block content %}
<h2>Messages</h2>
<form method="post" action="{{ url_for('messages.send_message') }}" class="row g-3 mb-4">
  <div class="col-md-4">
    <label class="form-label">Send to</label>
    <select name="receiver_id" class="form-select" required>
      {% for u in conversations %}
      <option value="{{ u.id }}">{{ u.name }} ({{ u.email }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-6">
    <label class="form-label">Message</label>
    <input type="text" name="body" class="form-control" placeholder="Type message" required />
  </div>
  <div class="col-md-2 d-flex align-items-end">
    <button class="btn btn-primary" type="submit">Send</button>
  </div>
</form>

<h4>Recent Messages</h4>
<ul class="list-group">
  {% for m in messages %}
  <li class="list-group-item">
    <strong>{{ 'You' if m.sender_id == current_user.id else m.sender.name }}:</strong>
    {{ m.body }}
    <small class="text-muted float-end">{{ m.created_at }}</small>
  </li>
  {% else %}
  <li class="list-group-item">No messages yet.</li>
  {% endfor %}
</ul>
{% endblock %}
